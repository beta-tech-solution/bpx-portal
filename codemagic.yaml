# codemagic.yaml
# This file defines the build workflow for Codemagic.
# It tells the cloud service how to build your Android and iOS apps.

workflows:
  capacitor-android-build:
    name: Capacitor Android Build
    instance_type: mac_mini_m1
    environment:
      node: 20.11.1
      groups:
        - firebase_secrets # This line is critical. It loads your Firebase keys.
      vars:
        BUILD_TARGET: mobile # Set the build target for mobile
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build and Sync Web App for Mobile
        script: |
          npm run mobile:sync
      - name: Build Android App
        script: |
          cd android
          ./gradlew assembleDebug # For a debug build to test
          # Use './gradlew bundleRelease' for a production release
    artifacts:
      - android/app/build/outputs/apk/debug/**/*.apk
      - android/app/build/outputs/bundle/release/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  capacitor-ios-build:
    name: Capacitor iOS Build
    instance_type: mac_mini_m1
    environment:
      node: 20.11.1
      xcode: latest
      cocoapods: default
      groups:
        - firebase_secrets # This line is critical. It loads your Firebase keys.
      vars:
        BUILD_TARGET: mobile # Set the build target for mobile
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build and Sync Web App for Mobile
        script: |
          npm run mobile:sync
      - name: Build iOS App
        script: |
          npx cap build ios --prod --release
    artifacts:
      - build/ios/ipa/**/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
